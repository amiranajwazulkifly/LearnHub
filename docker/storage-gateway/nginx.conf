# Minimal stand-in for the one Kong routing rule this app actually needs:
# the @supabase/supabase-js client always calls {SUPABASE_URL}/storage/v1/...
# (that prefix is normally stripped by Kong before reaching storage-api,
# which itself serves routes from its own root with no prefix at all).
# Rather than run the full Kong gateway for this single rule, this proxies
# /storage/v1/* -> storage:5000/* and nothing else.
server {
    listen 8000;

    location /storage/v1/ {
        proxy_pass http://storage:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100M;
    }

    location /status {
        return 200 "ok";
    }
}
