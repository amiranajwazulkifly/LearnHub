server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path that isn't a real static file goes to
    # index.html, so React Router handles the routing client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
